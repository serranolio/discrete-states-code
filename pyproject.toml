[project]
authors = [{name = "Federico Serrano", email = "serranolio@gmail.com"}]
description = "Discrete momentum-mode simulation of a spin-orbit coupled two-component BEC in an optical lattice"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "scipy>=1.16",
    "pandas>=2.3",
    "matplotlib>=3.10",
]
name = "discrete-states-code"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
discrete-states = "discrete_states_code.run_simulation:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
discrete_states_code = { path = ".", editable = true }

[tool.pixi.tasks]
simulate = "discrete-states"
example = "python examples/quickstart.py"

[tool.pixi.dependencies]
matplotlib = ">=3.10.8,<4"
scipy = ">=1.16.3,<2"
pandas = ">=2.3.3,<3"
